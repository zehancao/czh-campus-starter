<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园π - 样式预览 E</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #efe9d9;
      --ink: #111111;
      --green: #1f8a4c;
      --pink: #f06ca8;
      --orange: #f28c38;
      --yellow: #ffd84d;
      --blue: #2f63ff;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #d8d0bd; overflow: hidden; }
    body { font-family: "Noto Sans SC", sans-serif; }
    .viewport { position: fixed; inset: 0; overflow: hidden; }
    .stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      transform-origin: center center;
      background: var(--cream);
      box-shadow: 0 28px 80px rgba(0,0,0,.18);
    }
    .frame {
      position: absolute;
      inset: 72px;
      border: 5px solid var(--ink);
      background:
        linear-gradient(90deg, rgba(17,17,17,.04) 1px, transparent 1px),
        linear-gradient(0deg, rgba(17,17,17,.04) 1px, transparent 1px);
      background-size: 64px 64px;
    }
    .strip { position: absolute; border: 5px solid var(--ink); box-shadow: 16px 16px 0 var(--ink); }
    .strip.green { left: 112px; top: 112px; width: 330px; height: 118px; background: var(--green); }
    .strip.pink { right: 142px; top: 132px; width: 280px; height: 118px; background: var(--pink); }
    .strip.yellow { right: 320px; bottom: 128px; width: 390px; height: 118px; background: var(--yellow); }
    .strip.orange { left: 128px; bottom: 154px; width: 240px; height: 118px; background: var(--orange); }
    .topline {
      position: absolute;
      left: 510px;
      right: 510px;
      top: 124px;
      display: flex;
      justify-content: center;
      gap: 32px;
      font-family: "JetBrains Mono", monospace;
      font-size: 21px;
      color: var(--ink);
      font-weight: 700;
    }
    .hero {
      position: absolute;
      left: 186px;
      top: 284px;
      right: 186px;
      display: grid;
      grid-template-columns: 1fr 430px;
      gap: 84px;
      align-items: end;
    }
    .kicker {
      display: inline-block;
      font-family: "JetBrains Mono", monospace;
      background: var(--yellow);
      border: 4px solid var(--ink);
      padding: 16px 24px;
      font-size: 24px;
      font-weight: 700;
      box-shadow: 8px 8px 0 var(--ink);
    }
    h1 {
      margin: 42px 0 0;
      font-size: 150px;
      line-height: .98;
      letter-spacing: 0;
      color: var(--ink);
      font-weight: 900;
    }
    h1 strong {
      font-family: "Archivo Black", "Noto Sans SC", sans-serif;
      color: var(--blue);
      font-weight: 900;
    }
    .subtitle {
      margin-top: 42px;
      width: 930px;
      font-size: 42px;
      line-height: 1.38;
      font-weight: 700;
      color: #2b2b2b;
    }
    .spec {
      border: 5px solid var(--ink);
      background: #fffdf4;
      box-shadow: 18px 18px 0 var(--green);
      padding: 38px;
      display: grid;
      gap: 22px;
    }
    .spec-row {
      border-bottom: 4px solid var(--ink);
      padding-bottom: 19px;
      font-size: 31px;
      font-weight: 900;
      color: var(--ink);
    }
    .spec-row span {
      display: block;
      font-family: "JetBrains Mono", monospace;
      font-size: 17px;
      color: #5b5b5b;
      margin-bottom: 8px;
    }
    .footer {
      position: absolute;
      left: 510px;
      right: 510px;
      bottom: 120px;
      display: flex;
      justify-content: center;
      gap: 52px;
      font-size: 26px;
      font-weight: 800;
    }
    @media (prefers-reduced-motion: no-preference) {
      .strip, .hero, .footer { animation: pop .72s cubic-bezier(.2,.8,.2,1) both; }
      .hero { animation-delay: .1s; }
      .footer { animation-delay: .22s; }
    }
    @keyframes pop { from { opacity: 0; transform: translateY(24px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
  </style>
</head>
<body>
  <div class="viewport">
    <main class="stage" id="stage">
      <div class="frame"></div>
      <div class="strip green"></div>
      <div class="strip pink"></div>
      <div class="strip yellow"></div>
      <div class="strip orange"></div>
      <div class="topline">
        <div>HARMONYOS</div>
        <div>SPRING BOOT</div>
        <div>VUE ADMIN</div>
      </div>
      <section class="hero">
        <div>
          <div class="kicker">校园服务一体化实训项目</div>
          <h1>校园<strong>π</strong></h1>
          <div class="subtitle">连接学生端、后端服务与管理端的校园生活服务平台</div>
        </div>
        <aside class="spec">
          <div class="spec-row"><span>PROJECT</span>校园π</div>
          <div class="spec-row"><span>DEFENDER</span>曹泽涵</div>
          <div class="spec-row"><span>ADVISOR</span>谭堂</div>
          <div class="spec-row"><span>SCHOOL</span>中国民用航空飞行学院</div>
        </aside>
      </section>
      <footer class="footer">
        <div>项目答辩</div>
        <div>小组名：待定</div>
        <div>日期：待定</div>
      </footer>
    </main>
  </div>
  <script>
    const stage = document.getElementById('stage');
    function fit() {
      const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    window.addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
