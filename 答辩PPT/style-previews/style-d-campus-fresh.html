<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园π - 样式预览 D</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
  <style>
    :root {
      --mint: #d9f8e8;
      --sky: #ccecff;
      --lime: #b7ef4a;
      --blue: #1e5bff;
      --orange: #ff8b38;
      --ink: #102033;
      --muted: #5c6b78;
      --paper: #fffef6;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #dce7df; overflow: hidden; }
    body { font-family: "Noto Sans SC", sans-serif; }
    .viewport { position: fixed; inset: 0; overflow: hidden; }
    .stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      transform-origin: center center;
      background:
        radial-gradient(circle at 82% 20%, rgba(30,91,255,.14), transparent 320px),
        radial-gradient(circle at 16% 86%, rgba(255,139,56,.18), transparent 280px),
        linear-gradient(135deg, var(--mint), var(--sky) 48%, #fff8d7);
      box-shadow: 0 28px 80px rgba(0,0,0,.18);
    }
    .paper {
      position: absolute;
      left: 116px;
      top: 92px;
      right: 116px;
      bottom: 92px;
      background: rgba(255,254,246,.88);
      border: 4px solid var(--ink);
      border-radius: 38px;
      box-shadow: 18px 18px 0 rgba(16,32,51,.16);
    }
    .blob { position: absolute; border-radius: 999px; border: 4px solid var(--ink); }
    .blob.one { width: 220px; height: 110px; right: 220px; top: 160px; background: var(--lime); transform: rotate(-12deg); }
    .blob.two { width: 170px; height: 170px; right: 485px; bottom: 170px; background: #ffcfdf; }
    .blob.three { width: 290px; height: 82px; left: 670px; top: 165px; background: #ffffff; transform: rotate(8deg); }
    .nav {
      position: absolute;
      left: 176px;
      right: 176px;
      top: 150px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 28px;
      font-weight: 700;
    }
    .brand {
      color: var(--blue);
      font-size: 36px;
      font-weight: 900;
    }
    .hero {
      position: absolute;
      left: 176px;
      top: 285px;
      width: 1040px;
    }
    .tag {
      display: inline-block;
      padding: 17px 28px;
      border: 4px solid var(--ink);
      border-radius: 999px;
      background: var(--lime);
      color: var(--ink);
      font-size: 30px;
      font-weight: 900;
      box-shadow: 8px 8px 0 rgba(16,32,51,.18);
    }
    h1 {
      margin: 44px 0 0;
      font-size: 152px;
      line-height: 1;
      color: var(--ink);
      letter-spacing: 0;
      font-weight: 900;
    }
    h1 span {
      font-family: "ZCOOL QingKe HuangYou", "Noto Sans SC", sans-serif;
      color: var(--blue);
      font-size: 176px;
      font-weight: 400;
    }
    .subtitle {
      margin-top: 44px;
      width: 850px;
      color: #24384d;
      font-size: 42px;
      line-height: 1.38;
      font-weight: 700;
    }
    .cards {
      position: absolute;
      right: 176px;
      top: 322px;
      width: 450px;
      display: grid;
      gap: 24px;
    }
    .card {
      min-height: 112px;
      padding: 25px 34px;
      border: 4px solid var(--ink);
      border-radius: 28px;
      background: #fff;
      color: var(--ink);
      font-size: 31px;
      font-weight: 900;
      box-shadow: 10px 10px 0 rgba(16,32,51,.13);
    }
    .card:nth-child(2) { background: #ffe1bd; }
    .card:nth-child(3) { background: #dff7ff; }
    .footer {
      position: absolute;
      left: 176px;
      right: 176px;
      bottom: 150px;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 27px;
      font-weight: 700;
    }
    @media (prefers-reduced-motion: no-preference) {
      .hero, .cards, .footer { animation: rise .75s ease both; }
      .blob { animation: fadeOnly .75s ease both; }
      .cards { animation-delay: .12s; }
      .blob { animation-delay: .2s; }
      .footer { animation-delay: .28s; }
    }
    @keyframes rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeOnly { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="viewport">
    <main class="stage" id="stage">
      <section class="paper"></section>
      <div class="blob one"></div>
      <div class="blob two"></div>
      <div class="blob three"></div>
      <nav class="nav">
        <div class="brand">校园π</div>
        <div>中国民用航空飞行学院 · 实训项目答辩</div>
      </nav>
      <section class="hero">
        <div class="tag">学生校园服务平台</div>
        <h1>校园<span>π</span></h1>
        <div class="subtitle">面向校园学习、生活、交易与管理场景的一体化服务平台</div>
      </section>
      <aside class="cards">
        <div class="card">鸿蒙学生端</div>
        <div class="card">Spring Boot 后端</div>
        <div class="card">Vue 管理端</div>
      </aside>
      <div class="footer">
        <div>答辩人：曹泽涵</div>
        <div>指导教师：谭堂</div>
        <div>日期：待定</div>
      </div>
    </main>
  </div>
  <script>
    const stage = document.getElementById('stage');
    function fit() {
      const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    window.addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
