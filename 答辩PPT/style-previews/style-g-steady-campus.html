<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园π - 样式预览 G</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6fbf8;
      --ink: #132d35;
      --muted: #5b747c;
      --teal: #12a89d;
      --blue: #2e6bff;
      --lime: #d7f46b;
      --warm: #fff4d7;
      --line: rgba(19, 45, 53, .14);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #dfe9e5; }
    body { font-family: "Noto Sans SC", sans-serif; }
    .viewport { position: fixed; inset: 0; overflow: hidden; }
    .stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      transform-origin: center center;
      background:
        linear-gradient(90deg, var(--line) 1px, transparent 1px),
        linear-gradient(0deg, var(--line) 1px, transparent 1px),
        radial-gradient(circle at 82% 18%, rgba(46,107,255,.13), transparent 340px),
        radial-gradient(circle at 10% 92%, rgba(18,168,157,.16), transparent 320px),
        var(--bg);
      background-size: 96px 96px, 96px 96px, auto, auto, auto;
      box-shadow: 0 28px 80px rgba(0,0,0,.18);
    }
    .top {
      position: absolute;
      left: 118px;
      right: 118px;
      top: 90px;
      height: 92px;
      border-bottom: 3px solid var(--ink);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 27px;
      font-weight: 700;
    }
    .brand { color: var(--teal); font-size: 38px; font-weight: 900; }
    .main {
      position: absolute;
      left: 118px;
      right: 118px;
      top: 236px;
      bottom: 118px;
      display: grid;
      grid-template-columns: 1fr 530px;
      gap: 80px;
    }
    .hero {
      padding-top: 52px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .tag {
      width: fit-content;
      padding: 18px 30px;
      border-radius: 999px;
      background: var(--warm);
      border: 2px solid rgba(19,45,53,.22);
      color: var(--ink);
      font-size: 29px;
      font-weight: 900;
    }
    h1 {
      margin: 44px 0 0;
      font-family: "Nunito", "Noto Sans SC", sans-serif;
      font-size: 156px;
      line-height: .98;
      letter-spacing: 0;
      color: var(--ink);
      font-weight: 900;
    }
    h1 span {
      color: var(--blue);
    }
    .subtitle {
      margin-top: 42px;
      width: 890px;
      color: #2b4b54;
      font-size: 42px;
      line-height: 1.42;
      font-weight: 700;
    }
    .footer {
      display: flex;
      gap: 54px;
      color: var(--muted);
      font-size: 27px;
      font-weight: 700;
    }
    .panel {
      border-radius: 34px;
      background: #ffffff;
      border: 3px solid rgba(19,45,53,.14);
      box-shadow: 0 24px 60px rgba(19,45,53,.1);
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .panel::before {
      content: "";
      position: absolute;
      right: -84px;
      top: -84px;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: var(--lime);
      opacity: .75;
    }
    .panel-title {
      position: relative;
      font-size: 32px;
      font-weight: 900;
      color: var(--ink);
    }
    .stat {
      position: relative;
      font-family: "Nunito", sans-serif;
      font-size: 118px;
      line-height: 1;
      color: var(--teal);
      font-weight: 900;
    }
    .list { position: relative; display: grid; gap: 22px; }
    .list div {
      padding: 22px 24px;
      border-radius: 20px;
      background: #f2faf8;
      color: var(--ink);
      font-size: 29px;
      font-weight: 800;
    }
    @media (prefers-reduced-motion: no-preference) {
      .top, .hero, .panel { animation: rise .75s ease both; }
      .hero { animation-delay: .08s; }
      .panel { animation-delay: .16s; }
    }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="viewport">
    <main class="stage" id="stage">
      <header class="top">
        <div class="brand">校园π</div>
        <div>中国民用航空飞行学院 · 实训项目答辩</div>
      </header>
      <section class="main">
        <div class="hero">
          <div>
            <div class="tag">校园助手全栈系统</div>
            <h1>校园<span>π</span></h1>
            <div class="subtitle">面向校园学习、生活、交易与管理场景的一体化服务平台</div>
          </div>
          <div class="footer">
            <div>答辩人：曹泽涵</div>
            <div>指导教师：谭堂</div>
            <div>日期：待定</div>
          </div>
        </div>
        <aside class="panel">
          <div class="panel-title">项目展示结构</div>
          <div>
            <div class="stat">16</div>
            <div class="panel-title">页答辩内容</div>
          </div>
          <div class="list">
            <div>鸿蒙学生端</div>
            <div>Spring Boot 后端</div>
            <div>Vue 管理端</div>
          </div>
        </aside>
      </section>
    </main>
  </div>
  <script>
    const stage = document.getElementById('stage');
    function fit() {
      const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    window.addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
